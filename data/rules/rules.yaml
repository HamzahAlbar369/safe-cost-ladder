  none: {en: "no driving licence", ar: "لا توجد رخصة قيادة", source: "CMIR Art. 7.2"}
  expired: {en: "licence expired on the accident date", ar: "رخصة منتهية في تاريخ الحادث", source: "CMIR Art. 7.2"}
  wrong_class: {en: "licence not valid for this vehicle class", ar: "رخصة لا تناسب فئة المركبة", source: "CMIR Art. 7.2"}
