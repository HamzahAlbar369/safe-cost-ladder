    red_light: {en: "crossing a red light", ar: "قطع الإشارة الحمراء", source: "UP Art. 5"}
    use_outside_purpose: {en: "using the vehicle for a purpose other than the one in the policy", ar: "استخدام المركبة في غير الغرض المحدد في الوثيقة", source: "UP Art. 5"}
  own_damage_deny:       # CMIR Art. 7 (all listed); `generated: true` = the sampler produces it (D1.8)
    optional_cover_declined: {en: "loss under an optional cover the insured declined", ar: "خسارة تقع ضمن تغطية اختيارية رفضها المؤمَّن له", source: "CMIR Art. 7.1", generated: false}
    invalid_licence: {en: "no valid licence for the vehicle class, or a withdrawn licence; an expired licence counts as valid if renewed within the grace period", ar: "عدم وجود رخصة سارية لفئة المركبة أو رخصة مسحوبة؛ وتُعدّ الرخصة المنتهية سارية إذا جُدّدت خلال المهلة", source: "CMIR Art. 7.2", generated: true}
    below_deductible: {en: "the assessed loss is at or below the deductible", ar: "الخسارة المقدَّرة مساوية لمبلغ التحمل أو أقل منه", source: "CMIR Art. 7.3", generated: true}
    unauthorised_driver: {en: "the vehicle was driven by someone other than the insured or an authorised driver", ar: "قيادة المركبة من شخص غير المؤمَّن له أو السائق المصرَّح له", source: "CMIR Art. 7.4", generated: true}
    mechanical_failure: {en: "manufacturing defects or mechanical or electrical failure", ar: "عيوب التصنيع أو الأعطال الميكانيكية أو الكهربائية", source: "CMIR Art. 7.5", generated: false}
    tyres_rims_mirrors: {en: "damage to tyres, rims or mirrors alone, unless caused in a covered accident", ar: "أضرار الإطارات أو الجنوط أو المرايا وحدها ما لم تقع في حادث مغطى", source: "CMIR Art. 7.6", generated: false}
    cargo_belongings: {en: "loss of cargo or personal belongings in the vehicle", ar: "فقدان الحمولة أو المتعلقات الشخصية داخل المركبة", source: "CMIR Art. 7.7", generated: false}
    trailer: {en: "damage to a trailer not named in the schedule", ar: "أضرار مقطورة غير مذكورة في الجدول", source: "CMIR Art. 7.8", generated: false}
    theft_running_unlocked: {en: "theft from a running or unlocked vehicle", ar: "السرقة من مركبة تعمل أو غير مقفلة", source: "CMIR Art. 7.9", generated: false}
    aftermarket_accessories: {en: "accessories not fitted by the manufacturer", ar: "الملحقات غير المركّبة من المصنّع", source: "CMIR Art. 7.10", generated: false}
    use_violating_restrictions: {en: "use that breaks the policy's limits on use", ar: "الاستخدام المخالف لقيود الاستخدام في الوثيقة", source: "CMIR Art. 7.11", generated: false}
    overloading: {en: "carrying more passengers or load than permitted, causing the accident", ar: "تجاوز عدد الركاب أو الحمولة المسموح بها بما تسبب في الحادث", source: "CMIR Art. 7.12", generated: false}
    racing_speed_trials: {en: "racing, speed trials or testing", ar: "السباقات أو اختبارات السرعة أو التجارب", source: "CMIR Art. 7.13", generated: false}
    impaired_driver: {en: "a driver impaired by alcohol, drugs or medicines", ar: "سائق تحت تأثير الكحول أو المخدرات أو الأدوية", source: "CMIR Art. 7.14", generated: false}
    working_machinery: {en: "use of the vehicle as working machinery", ar: "استخدام المركبة آلةً للعمل", source: "CMIR Art. 7.15", generated: false}
    traffic_violation_cause: {en: "drifting, crossing a red light or driving against traffic, when the report shows it caused the accident", ar: "التفحيط أو قطع الإشارة الحمراء أو القيادة عكس السير، إذا أثبت التقرير أنه سبب الحادث", source: "CMIR Art. 7.16", generated: true}
    restricted_area: {en: "use inside restricted areas such as airports or seaports", ar: "الاستخدام داخل المناطق المحظورة كالمطارات والموانئ", source: "CMIR Art. 7.17", generated: false}
    criminal_acts: {en: "criminal or hostile acts by the insured or driver", ar: "الأفعال الجنائية أو العدائية من المؤمَّن له أو السائق", source: "CMIR Art. 7.18", generated: false}
    deliberate: {en: "an accident caused deliberately", ar: "حادث متعمَّد", source: "CMIR Art. 7.19", generated: false}
    war_terrorism: {en: "war, terrorism, nuclear incidents or rebellion", ar: "الحرب أو الإرهاب أو الحوادث النووية أو التمرد", source: "CMIR Art. 7.20", generated: false}
    off_road_desert: {en: "driving in the desert or on unpaved roads outside cities", ar: "القيادة في الصحراء أو الطرق غير المعبّدة خارج المدن", source: "CMIR Art. 7.21", generated: false}

