authorised_drivers:   # CMIR Art. 1.8 "Driver" + named drivers; anyone else -> Art. 7.4
  insured: {en: "the insured", ar: "المؤمَّن له", source: "CMIR Art. 1.8"}
  named_driver: {en: "a named driver on the schedule", ar: "سائق مسمّى في الجدول", source: "CMIR Art. 1.8"}
