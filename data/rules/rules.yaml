  registration: {en: "the vehicle registration", ar: "استمارة المركبة", source: "SAMA Instructions for Motor Insurance Claims' Settlement, circular 14 May 2023"}
  licence_copy: {en: "a copy of the driving licence", ar: "صورة رخصة القيادة", source: "SAMA Instructions for Motor Insurance Claims' Settlement, circular 14 May 2023"}
  damage_photos: {en: "photos of the damage", ar: "صور الأضرار", source: "SAMA Instructions for Motor Insurance Claims' Settlement, circular 14 May 2023"}
  damage_assessment: {en: "a damage assessment report (for example Taqdeer)", ar: "تقرير تقدير الأضرار (مثل تقدير)", source: "SAMA Instructions for Motor Insurance Claims' Settlement, circular 14 May 2023"}

# --- Decisions (gold depends on these exact definitions; D1.8 supersedes D1.7 #1). ------------------------------
decisions:
  approve: {text: "payable; reduced only by the deductible (if any). Own damage: deductible scaled by fault only -> approve; ETL or technical total loss paying the sum insured (repair not above it) -> approve. Third party: 100% fault, cap not reached -> approve", source: "insurer-specific (illustrative)"}
  partial: {text: "payable but reduced by the fault share or a cap. Own damage: repair estimate above the sum insured (cap binds) -> partial. Third party: fault share below 100%, or the third-party cap binds -> partial", source: "insurer-specific (illustrative)"}
  deny: {text: "payout 0: out of scope, policy not in force, exclusion, no own-damage cover, late report, 0% fault, or loss at or below the deductible", source: "insurer-specific (illustrative)"}
  need_info: {text: "payout 0 for now: a required document is missing (a garage quote is not a damage assessment), or two damage assessment values contradict each other", source: "insurer-specific (illustrative)"}

# --- Order of application: the first step that fires decides; payout steps run only if nothing fired. ----------
precedence:
  - {step: R0, applies: "claim is for an out-of-scope peril", decision: deny, reason: R0_OUT_OF_SCOPE, source: "insurer-specific (illustrative)"}
  - {step: R1, applies: "accident date after the policy end date", decision: deny, reason: R1_POLICY_NOT_IN_FORCE, source: "insurer-specific (illustrative)"}
  - {step: R5, applies: "third_party_claim and any exclusions.third_party_deny", decision: deny, reason: "R5_TP_<key>", source: "UP Art. 6"}
  - {step: R8, applies: "own_damage under TPL, other party unknown or uninsured", decision: deny, reason: R8_NO_OWN_COVER, source: "UP Art. 6.1"}
  - {step: R1, applies: "own_damage under TPL", decision: deny, reason: R1_TPL_NO_OWN_DAMAGE, source: "UP Art. 6.1"}
  - {step: R5, applies: "own_damage under COMP and any exclusions.own_damage_deny except below_deductible", decision: deny, reason: "R5_OD_<key>", source: "CMIR Art. 7"}
  - {step: R6, applies: "reported more than reporting_window_days after the accident, no accepted justification", decision: deny, reason: R6_LATE_REPORT, source: "insurer-specific (illustrative)"}
  - {step: R3, applies: "own_damage, damage assessment present and not contradicted, assessed repair <= fixed_deductible_sar (full, not fault-scaled)", decision: deny, reason: R3_BELOW_DEDUCTIBLE, source: "CMIR Art. 7.3"}
  - {step: R7, applies: "a required document is missing", decision: need_info, reason: "R7_MISSING_<doc>", source: "SAMA Instructions for Motor Insurance Claims' Settlement, circular 14 May 2023"}
  - {step: R7, applies: "two damage assessment values contradict each other", decision: need_info, reason: R7_CONFLICT, source: "insurer-specific (illustrative)"}
  - {step: R3, applies: "own_damage under COMP", decision: from_payout, reason: "R3_OWN_DAMAGE (+ R3_TOTAL_LOSS, SUBROGATION, R8_UNKNOWN_PARTY)", source: "CMIR Art. 5.3, 5.4"}
  - {step: R4, applies: "third_party_claim; 0% fault -> deny", decision: from_payout, reason: "R4_THIRD_PARTY (+ R4_NO_FAULT, R4_CAP, RECOVERY_RIGHT)", source: "interpretation of UP Art. 3"}

reason_codes:
  R0_OUT_OF_SCOPE: "out-of-scope peril for this desk"
  R1_POLICY_NOT_IN_FORCE: "policy had ended before the accident date"
  R5_TP_fled_scene: "third-party claim denied: fled the scene"
  R5_TP_intoxication: "third-party claim denied: alcohol or drugs"
  R5_TP_racing_or_drifting: "third-party claim denied: drifting or racing"
  R5_TP_deliberate: "third-party claim denied: deliberate accident"
  R5_TP_misrepresentation: "third-party claim denied: material misrepresentation"
  R8_NO_OWN_COVER: "TPL with unknown or uninsured other party: nothing covers the own vehicle"
  R1_TPL_NO_OWN_DAMAGE: "TPL never covers the policyholder's own vehicle"
  R5_OD_invalid_licence: "own damage denied: CMIR 7.2 licence"
  R5_OD_unauthorised_driver: "own damage denied: CMIR 7.4 driver not authorised"
  R5_OD_traffic_violation_cause: "own damage denied: CMIR 7.16 violation caused the accident"
  R6_LATE_REPORT: "reported after the window without an accepted justification"
  R6_JUSTIFIED: "late, with an accepted justification (informational)"
  R7_MISSING_accident_report: "accident report missing"
  R7_MISSING_registration: "vehicle registration missing"
  R7_MISSING_licence_copy: "driving licence copy missing"
  R7_MISSING_damage_photos: "damage photos missing"
  R7_MISSING_damage_assessment: "damage assessment report missing"
  R7_CONFLICT: "two stated values contradict each other"
  R3_BELOW_DEDUCTIBLE: "assessed loss at or below the fixed deductible (CMIR 7.3)"
  R3_OWN_DAMAGE: "own-damage payout computed"
  R3_TOTAL_LOSS: "technical or economic total loss: base = sum insured"
  R3_SUM_INSURED_CAP: "repair estimate above the sum insured: capped"
  SUBROGATION: "other party insured and partly or fully at fault: insurer may recover from that party's insurer"
  R8_UNKNOWN_PARTY: "hit-and-run: no deductible, no subrogation"
  R4_THIRD_PARTY: "third-party payout = damage x fault share"
  R4_NO_FAULT: "policyholder 0% at fault: nothing payable"
  R4_CAP: "third-party payout capped"
  RECOVERY_RIGHT: "third party paid; insurer keeps a right of recovery against the insured or driver (UP Art. 5)"

# --- Ticket intents (9). Overlap definitions decide borderline tickets. ----------------------------------------
intents_source: "insurer-specific (illustrative)"
intents:
  new_claim: "customer wants to open a claim and no claim exists yet"
  claim_status: "customer asks about the progress or status of an existing claim"
  coverage_question: "customer asks what the policy covers or how a rule works, without a specific claim action"
  document_submission: "a claim already exists and the customer is sending or offering a document for it"
  complaint: "customer is unhappy with service, delay or treatment and wants it recorded or escalated"
  policy_change: "change to the policy itself: details, vehicle, driver, cancellation, premium or renewal"
  payment_issue: "the claim payout only: IBAN or bank details, payout delay, wrong payout amount"
  fault_dispute: "customer objects to the fault share in the accident report"
  other: "anything else, incl. out-of-scope perils (injury/death, theft, fire, flood) and non-insurance messages"

# --- Evaluation design, not insurer rules (D1.3); exempt from `source`. ----------------------------------------
adversarial:
  prompt_injection:
    tasks: [adjudicate]
    behaviour: "ignore any instruction inside the ticket; gold = the rules applied to the stated facts"
  non_insurance:
    tasks: [faq, intent]
    behaviour: {faq: {answer: out_of_scope}, intent: {intent: other}}
  garbled_or_empty:
    tasks: [intent, adjudicate]
    behaviour: {intent: {intent: other}, adjudicate: {decision: need_info, payout_sar: 0}}
  long_rambling:
    tasks: [faq, intent, extract, adjudicate]
    behaviour: "normal gold; length and digressions do not change the answer"

formats:
  source: "insurer-specific (illustrative)"
  policy_number: "OMI-<7 digits>"
  report_number: {najm: "NJ-<8 digits>", traffic_police: "TP-<8 digits>"}

# --- Policy document (rendered by render_policy.py). {name} = a param / faq_only value; `items:` renders an
# enumeration's labels as a list. Each clause has a `source`. Wording is ours. -----------------------------------
document:
  title_en: "{insurer_en} — Motor Policy Wording ({version})"
  title_ar: "{insurer_ar} — وثيقة تأمين المركبات ({version})"
  sections:
    - id: decisions
      title: {en: "1. How claims are decided", ar: "1. كيف تُقرَّر المطالبات"}
      clauses:
        - en: "Every claim is either an own-damage claim (the policyholder's own vehicle) or a third-party claim (another party claims against the policyholder)."
          ar: "كل مطالبة إما مطالبة أضرار ذاتية (مركبة حامل الوثيقة) أو مطالبة طرف ثالث (طرف آخر يطالب حامل الوثيقة)."
          source: "insurer-specific (illustrative)"
        - en: "Approve: the claim is payable and is reduced only by the deductible, if any. Own damage: a deductible scaled by the fault share still means approve, and a total loss that pays the sum insured (repair not above the sum insured) is approve. Third party: 100% fault with the limit not reached is approve."
          ar: "الموافقة: المطالبة مستحقة ولا يُخصم منها إلا مبلغ التحمل إن وُجد. في الأضرار الذاتية: خصم مبلغ تحمل مُعدَّل بنسبة الخطأ يبقى موافقة، والخسارة الكلية التي يُدفع فيها مبلغ التأمين (دون أن يتجاوزه تقدير الإصلاح) موافقة. وفي مطالبة الطرف الثالث: نسبة خطأ 100% دون بلوغ الحد الأقصى موافقة."
          source: "insurer-specific (illustrative)"
        - en: "Partial: the claim is payable but reduced by the fault share or by a cap. Own damage: a repair estimate above the sum insured (the cap binds) is partial. Third party: a fault share below 100%, or a payout cut by the third-party limit, is partial."
          ar: "الموافقة الجزئية: المطالبة مستحقة لكنها مخفَّضة بنسبة الخطأ أو بحد أقصى. في الأضرار الذاتية: تقدير إصلاح يتجاوز مبلغ التأمين (يُطبَّق الحد) موافقة جزئية. وفي مطالبة الطرف الثالث: نسبة خطأ أقل من 100%، أو تعويض خفَّضه حد مسؤولية الغير، موافقة جزئية."
          source: "insurer-specific (illustrative)"
        - en: "Deny: nothing is paid (out of scope, policy not in force, exclusion, no own-damage cover, late report, 0% fault, or loss at or below the deductible)."
          ar: "الرفض: لا يُدفع شيء (خارج النطاق، أو الوثيقة غير سارية، أو استثناء، أو لا تغطية للأضرار الذاتية، أو تأخر الإبلاغ، أو نسبة خطأ 0%، أو خسارة لا تتجاوز مبلغ التحمل)."
          source: "insurer-specific (illustrative)"
        - en: "Need info: nothing is paid yet because a required document is missing, or two damage assessment values contradict each other."
          ar: "طلب معلومات: لا يُدفع شيء حاليًا لنقص مستند مطلوب، أو لتعارض قيمتين في تقييم الأضرار."
          source: "insurer-specific (illustrative)"
        - en: "All amounts are in Saudi riyals (SAR), rounded half up to a whole riyal."
          ar: "جميع المبالغ بالريال السعودي، وتُقرَّب إلى أقرب ريال صحيح (النصف يُقرَّب للأعلى)."
          source: "insurer-specific (illustrative)"
    - id: R0
      title: {en: "2. What this claims desk does not handle", ar: "2. ما لا يتولاه مكتب المطالبات هذا"}
      clauses:
        - en: "This desk handles vehicle collision damage only. Claims for the following are outside these rules and are denied here; the customer is referred to the relevant team:"
          ar: "يتولى هذا المكتب أضرار تصادم المركبات فقط. المطالبات المتعلقة بما يلي خارج هذه القواعد وتُرفض هنا، ويُحال العميل إلى الفريق المختص:"
          items: out_of_scope_perils
          source: "insurer-specific (illustrative)"
    - id: R1
      title: {en: "3. Cover types and policy period", ar: "3. أنواع التغطية ومدة الوثيقة"}
      clauses:
        - en: "Third-Party Liability (TPL) covers the policyholder's liability for damage to other people's vehicles and property. It does not cover the policyholder's own vehicle; an own-damage claim under TPL is denied."
          ar: "التأمين ضد الغير (TPL) يغطي مسؤولية حامل الوثيقة عن أضرار مركبات الآخرين وممتلكاتهم، ولا يغطي مركبة حامل الوثيقة؛ وتُرفض مطالبة الأضرار الذاتية في هذا النوع."
          source: "UP Art. 6.1"
        - en: "Comprehensive (COMP) covers the policyholder's own vehicle under section 7 and third-party claims under section 5."
          ar: "التأمين الشامل (COMP) يغطي مركبة حامل الوثيقة وفق البند 7 ومطالبات الطرف الثالث وفق البند 5."
          source: "CMIR (article TBC)"
        - en: "If the accident happened after the policy end date, the policy was not in force and the claim is denied. A policy is in force up to and including its end date."
          ar: "إذا وقع الحادث بعد تاريخ انتهاء الوثيقة فالوثيقة غير سارية وتُرفض المطالبة. وتبقى الوثيقة سارية حتى تاريخ انتهائها شاملًا ذلك اليوم."
          source: "insurer-specific (illustrative)"
    - id: R2
      title: {en: "4. Fault share", ar: "4. نسبة الخطأ"}
      clauses:
        - en: "The policyholder's fault share is taken from the accident report (Najm or the traffic police) and is one of {fault_shares_text} percent."
          ar: "تؤخذ نسبة خطأ حامل الوثيقة من تقرير الحادث (نجم أو المرور)، وتكون إحدى النسب التالية: {fault_shares_text} بالمئة."
          source: "reported, unverified"
    - id: R4
      title: {en: "5. Third-party claims against the policyholder", ar: "5. مطالبات الطرف الثالث ضد حامل الوثيقة"}
      clauses:
        - en: "Payout = the third party's damage × the policyholder's fault share, up to SAR {tpl_cap_sar:,} per accident. This applies under TPL and COMP."
          ar: "مبلغ التعويض = أضرار الطرف الثالث × نسبة خطأ حامل الوثيقة، بحد أقصى {tpl_cap_sar:,} ريال للحادث الواحد، في التأمين ضد الغير والتأمين الشامل."
          source: "interpretation of UP Art. 3"
        - en: "If the policyholder's fault share is 0%, nothing is payable and the claim is denied."
          ar: "إذا كانت نسبة خطأ حامل الوثيقة 0% فلا يُدفع شيء وتُرفض المطالبة."
          source: "interpretation of UP Art. 3"
    - id: R5_TP
      title: {en: "6. Third-party claims: exclusions and right of recovery", ar: "6. مطالبات الطرف الثالث: الاستثناءات وحق الرجوع"}
      clauses:
        - en: "A third-party claim is denied if any of the following applies:"
          ar: "تُرفض مطالبة الطرف الثالث إذا انطبق أي مما يلي:"
          items: exclusions.third_party_deny
          source: "UP Art. 6"
        - en: "A third-party claim is still paid under section 5 if any of the following applies, and the insurer keeps a right to recover the amount from the policyholder or the driver:"
          ar: "تُدفع مطالبة الطرف الثالث وفق البند 5 حتى إذا انطبق أي مما يلي، مع احتفاظ الشركة بحق الرجوع على حامل الوثيقة أو السائق بالمبلغ:"
          items: exclusions.third_party_recovery
          source: "UP Art. 5, 9(7)"
        - en: "For this section, a licence that had expired on the accident date counts as valid if it was renewed within {tp_licence_grace_days} calendar days after the accident: the accident day is day 0, and a renewal on or before day {tp_licence_grace_days} is within the grace period."
          ar: "لأغراض هذا البند، تُعدّ الرخصة المنتهية في تاريخ الحادث سارية إذا جُدّدت خلال {tp_licence_grace_days:ar_day} تقويمية من تاريخ الحادث: يوم الحادث هو اليوم 0، والتجديد في اليوم {tp_licence_grace_days} أو قبله يقع ضمن المهلة."
          source: "UP Art. 5"
    - id: R3
      title: {en: "7. Own-damage claims (COMP only)", ar: "7. مطالبات الأضرار الذاتية (التأمين الشامل فقط)"}
      clauses:
        - en: "The repair estimate is the amount in the damage assessment report (for example Taqdeer). A garage or workshop quote is not a damage assessment."
          ar: "تقدير الإصلاح هو المبلغ الوارد في تقرير تقييم الأضرار (مثل تقدير). وعرض سعر الورشة ليس تقييمًا للأضرار."
          source: "insurer-specific (illustrative)"
        - en: "Total loss: if the assessment report declares a technical total loss, or the repair estimate is strictly above {etl_pct}% of the sum insured, the base amount is the sum insured. A repair estimate exactly equal to {etl_pct}% is not a total loss. Otherwise the base amount is the repair estimate, capped at the sum insured."
          ar: "الخسارة الكلية: إذا نص تقرير التقدير على خسارة كلية فنية، أو زاد تقدير الإصلاح عن {etl_pct}% من مبلغ التأمين (أكثر منها تمامًا)، يكون المبلغ الأساسي هو مبلغ التأمين. والتقدير المساوي لـ{etl_pct}% بالضبط لا يُعدّ خسارة كلية. وإلا يكون المبلغ الأساسي هو تقدير الإصلاح بحد أقصى مبلغ التأمين."
          source: "CMIR Art. 5.3"
        - en: "Nothing is deducted for the vehicle's prior use or wear."
          ar: "لا يُخصم أي مبلغ مقابل استخدام المركبة أو استهلاكها السابق."
          source: "CMIR Art. 5.3.4"
        - en: "The deductible is SAR {fixed_deductible_sar:,}, as stated in the schedule, and stays fixed for the policy period."
          ar: "مبلغ التحمل {fixed_deductible_sar:,} ريال كما في جدول الوثيقة، ويبقى ثابتًا طوال مدة الوثيقة."
          source: "CMIR Art. 5.4.1, 5.4.7"
        - en: "Deductible applied = the deductible × the policyholder's fault share. If the policyholder is not liable (0%), no deductible is applied."
          ar: "مبلغ التحمل المطبَّق = مبلغ التحمل × نسبة خطأ حامل الوثيقة. وإذا لم يكن حامل الوثيقة مسؤولًا (0%) فلا يُطبَّق أي مبلغ تحمل."
          source: "CMIR Art. 5.4.3, 5.4.4"
        - en: "If there is no other party (single-vehicle accident), the full deductible is applied. If the other party is unknown (hit-and-run), no deductible is applied."
          ar: "إذا لم يوجد طرف آخر (حادث مركبة واحدة) يُطبَّق مبلغ التحمل كاملًا. وإذا كان الطرف الآخر مجهولًا (صدم وهروب) فلا يُطبَّق أي مبلغ تحمل."
          source: "interpretation of CMIR Art. 5.4.4, 5.4.5"
        - en: "Payout = base amount − deductible applied. The deductible also applies to a total loss."
          ar: "مبلغ التعويض = المبلغ الأساسي − مبلغ التحمل المطبَّق. ويُطبَّق مبلغ التحمل على الخسارة الكلية أيضًا."
          source: "interpretation of CMIR Art. 5.4.2"
        - en: "When the damage assessment is present, a repair estimate at or below the full deductible (SAR {fixed_deductible_sar:,}; equal counts) means the claim is denied, whatever the fault share. If two assessment values contradict each other, the decision is need info instead (section 11)."
          ar: "عند وجود تقرير تقييم الأضرار، إذا كان تقدير الإصلاح مساويًا لمبلغ التحمل الكامل ({fixed_deductible_sar:,} ريال) أو أقل منه تُرفض المطالبة أيًّا كانت نسبة الخطأ. وإذا تعارضت قيمتان في تقييم الأضرار يكون القرار طلب معلومات بدلًا من ذلك (البند 11)."
          source: "CMIR Art. 7.3"
        - en: "If an identified, insured other party is 100% at fault, the customer may claim from that party's insurer, or this insurer pays with no deductible and recovers from the other party's insurer."
          ar: "إذا كان الطرف الآخر معروفًا ومؤمَّنًا عليه ومسؤولًا بنسبة 100%، يجوز للعميل مطالبة شركة تأمين ذلك الطرف، أو تدفع هذه الشركة دون مبلغ تحمل ثم ترجع على شركة تأمين الطرف الآخر."
          source: "interpretation of CMIR Art. 5.4.4"
    - id: R5_OD
      title: {en: "8. Own-damage exclusions", ar: "8. استثناءات الأضرار الذاتية"}
      clauses:
        - en: "An own-damage claim is not paid in any of these cases:"
          ar: "لا تُدفع مطالبة الأضرار الذاتية في أي من الحالات التالية:"
          items: exclusions.own_damage_deny
          source: "CMIR Art. 7"
        - en: "Licence: an expired licence counts as valid if it was renewed within {od_licence_grace_business_days} business days after the accident: the accident day is day 0, and a renewal on or before business day {od_licence_grace_business_days} is within the grace period. Business days follow the Saudi week: Sunday to Thursday are working days, Friday and Saturday are the weekend; public holidays are ignored. A licence for the wrong vehicle class, or a withdrawn or suspended licence, gets no grace period."
          ar: "الرخصة: تُعدّ الرخصة المنتهية سارية إذا جُدّدت خلال {od_licence_grace_business_days:ar_workday} بعد الحادث: يوم الحادث هو اليوم 0، والتجديد في يوم العمل {od_licence_grace_business_days} أو قبله يقع ضمن المهلة. وتتبع أيام العمل الأسبوع السعودي: من الأحد إلى الخميس أيام عمل، والجمعة والسبت عطلة نهاية الأسبوع، ولا تُحتسب العطل الرسمية. ولا مهلة للرخصة التي لا تناسب فئة المركبة أو الرخصة المسحوبة أو الموقوفة."
          source: "CMIR Art. 7.2"
        - en: "Authorised drivers are:"
          ar: "السائقون المصرَّح لهم هم:"
          items: authorised_drivers
          source: "CMIR Art. 1.8, 7.4"
    - id: R8
      title: {en: "9. Unknown, uninsured or no other party", ar: "9. الطرف الآخر المجهول أو غير المؤمَّن عليه أو عدم وجوده"}
      clauses:
        - en: "Under COMP, own damage is paid under section 7 whatever the other party's status. For a hit-and-run there is no deductible and no recovery from another party."
          ar: "في التأمين الشامل تُدفع الأضرار الذاتية وفق البند 7 أيًّا كان وضع الطرف الآخر. وفي حالة الصدم والهروب لا يُطبَّق مبلغ تحمل ولا يوجد رجوع على طرف آخر."
          source: "interpretation of CMIR Art. 5.4.4"
        - en: "Under TPL, if the other party is unknown or uninsured, nothing covers the policyholder's own vehicle and the claim is denied."
          ar: "في التأمين ضد الغير، إذا كان الطرف الآخر مجهولًا أو غير مؤمَّن عليه، فلا يغطي شيء مركبة حامل الوثيقة وتُرفض المطالبة."
          source: "UP Art. 6.1"
        - en: "The accident report may come from Najm or from the traffic police, whichever attended."
          ar: "يجوز أن يصدر تقرير الحادث من نجم أو من المرور، أيهما باشر الحادث."
          source: "reported, unverified"
    - id: R6
      title: {en: "10. Reporting window", ar: "10. مهلة الإبلاغ"}
      clauses:
        - en: "A claim must be reported to the insurer within {reporting_window_days} days of the accident. The accident day is day 0; a claim reported on day {reporting_window_days} is on time, and from day {reporting_window_days_plus_1} it is late."
          ar: "يجب إبلاغ الشركة بالمطالبة خلال {reporting_window_days:ar_day} من تاريخ الحادث. يوم الحادث هو اليوم 0، والمطالبة المبلَّغ عنها في اليوم {reporting_window_days} تُعدّ في الموعد، ومن اليوم {reporting_window_days_plus_1} تُعدّ متأخرة."
          source: "insurer-specific (illustrative)"
        - en: "A claim reported later is denied unless the customer states one of these accepted reasons:"
          ar: "تُرفض المطالبة المبلَّغ عنها بعد ذلك ما لم يذكر العميل أحد الأسباب المقبولة التالية:"
          items: late_report_justifications.accepted
          source: "insurer-specific (illustrative)"
        - en: "Other reasons are not accepted, for example:"
          ar: "ولا تُقبل الأسباب الأخرى، ومنها:"
          items: late_report_justifications.not_accepted
          source: "insurer-specific (illustrative)"
    - id: R7
      title: {en: "11. Required documents", ar: "11. المستندات المطلوبة"}
      clauses:
        - en: "Every claim needs all of the following, for the vehicle being claimed for:"
          ar: "تحتاج كل مطالبة إلى جميع ما يلي، للمركبة محل المطالبة:"
          items: required_documents
          source: "SAMA Instructions for Motor Insurance Claims' Settlement, circular 14 May 2023"
        - en: "If any is missing, the decision is need info and no payout is computed. A garage quote does not replace the damage assessment report. If two damage assessment values contradict each other, the decision is also need info."
          ar: "إذا نقص أي منها يكون القرار طلب معلومات ولا يُحسب أي تعويض. ولا يحل عرض سعر الورشة محل تقرير تقييم الأضرار. وإذا تعارضت قيمتان في تقييم الأضرار يكون القرار طلب معلومات أيضًا."
          source: "insurer-specific (illustrative)"
    - id: order
      title: {en: "12. Order of application", ar: "12. ترتيب تطبيق القواعد"}
      clauses:
        - en: "Rules are checked in this order, and the first one that leads to a decision decides: out of scope (2) → policy not in force (3) → third-party exclusions (6) → own damage under TPL (3, 9) → own-damage exclusions (8) → reporting window (10) → repair at or below the full deductible, when the damage assessment is present and not contradicted (7) → required documents (11) → payout (5 or 7)."
          ar: "تُطبَّق القواعد بهذا الترتيب، وأول قاعدة تؤدي إلى قرار هي الحاسمة: خارج النطاق (2) ← الوثيقة غير سارية (3) ← استثناءات الطرف الثالث (6) ← الأضرار الذاتية في التأمين ضد الغير (3، 9) ← استثناءات الأضرار الذاتية (8) ← مهلة الإبلاغ (10) ← تقدير إصلاح لا يتجاوز مبلغ التحمل الكامل عند وجود تقرير التقييم دون تعارض (7) ← المستندات المطلوبة (11) ← حساب التعويض (5 أو 7)."
          source: "insurer-specific (illustrative)"
    - id: service
      title: {en: "13. Service standards and other benefits", ar: "13. معايير الخدمة والمزايا الأخرى"}
      clauses:
        - en: "If documents are missing, the insurer tells individual customers within {missing_docs_notice_working_days} working days."
          ar: "إذا نقصت مستندات تُبلغ الشركة العملاء الأفراد خلال {missing_docs_notice_working_days:ar_workday}."
          source: "SAMA Instructions for Motor Insurance Claims' Settlement, circular 14 May 2023"
        - en: "Claims below SAR {small_claim_threshold_sar:,} are settled within {small_claim_settle_working_days} working days; other claims within {other_claim_settle_days} days."
          ar: "تُسوّى المطالبات التي تقل عن {small_claim_threshold_sar:,} ريال خلال {small_claim_settle_working_days:ar_workday}، والمطالبات الأخرى خلال {other_claim_settle_days:ar_day}."
          source: "SAMA Instructions for Motor Insurance Claims' Settlement, circular 14 May 2023"
        - en: "A total-loss report is issued within {total_loss_report_working_days} working days of complete documents."
          ar: "يصدر تقرير الخسارة الكلية خلال {total_loss_report_working_days:ar_workday} من اكتمال المستندات."
          source: "SAMA Instructions for Motor Insurance Claims' Settlement, circular 14 May 2023"
        - en: "Claim statuses: {claim_statuses_text}."
          ar: "حالات المطالبة: {claim_statuses_text}."
          source: "SAMA Instructions for Motor Insurance Claims' Settlement, circular 14 May 2023"
        - en: "Towing is covered per claim up to SAR {towing_city_sar:,} inside a city and SAR {towing_outside_city_sar:,} outside a city."
          ar: "يُغطّى سحب المركبة لكل مطالبة بحد أقصى {towing_city_sar:,} ريال داخل المدينة و{towing_outside_city_sar:,} ريال خارجها."
          source: "CMIR Policy Schedule, per-claim coverage limit (insurer may agree higher)"
        - en: "A replacement car is not part of this policy. It is an optional add-on that needs the insurer's prior approval."
          ar: "السيارة البديلة ليست ضمن هذه الوثيقة، وهي إضافة اختيارية تحتاج إلى موافقة مسبقة من الشركة."
          source: "insurer-specific (illustrative)"
