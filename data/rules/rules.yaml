  traffic_police: {en: "the traffic police", ar: "المرور", source: "reported, unverified"}

out_of_scope_perils:   # R0: this fictional desk handles collision damage only
  injury_or_death: {en: "bodily injury or death", ar: "الإصابات الجسدية أو الوفاة", source: "insurer-specific (illustrative)"}
  theft: {en: "theft of the vehicle", ar: "سرقة المركبة", source: "insurer-specific (illustrative)"}
  fire: {en: "fire", ar: "الحريق", source: "insurer-specific (illustrative)"}
  flood: {en: "flood", ar: "السيول والفيضانات", source: "insurer-specific (illustrative)"}

licence_status:
