    invalid_licence: {en: "the driver had no valid licence (an expired licence renewed within the grace period counts as valid)", ar: "عدم حيازة السائق رخصة سارية (الرخصة المنتهية المجدَّدة خلال المهلة تُعدّ سارية)", source: "UP Art. 5"}
