  third_party_claim: {en: "third-party claim (another party claims against the policyholder)", ar: "مطالبة طرف ثالث (طرف آخر يطالب حامل الوثيقة)", source: "insurer-specific (illustrative)"}

other_party:
  insured: {en: "identified and insured", ar: "معروف ومؤمَّن عليه", source: "insurer-specific (illustrative)"}
  uninsured: {en: "identified but uninsured", ar: "معروف وغير مؤمَّن عليه", source: "insurer-specific (illustrative)"}
  unknown: {en: "unknown (hit-and-run)", ar: "مجهول (صدم وهروب)", source: "interpretation of CMIR Art. 5.4.4"}
  none: {en: "no other party (single-vehicle accident)", ar: "لا يوجد طرف آخر (حادث مركبة واحدة)", source: "interpretation of CMIR Art. 5.4.5"}

report_sources:
