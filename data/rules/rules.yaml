# Single source of truth for the policy document the models read AND the gold labels (SPEC §4.1).
# The insurer (Oasis Motor Insurance) is FICTIONAL. Rules follow the SAMA-issued instruments below (articles
# cited per item); insurer-specific terms are illustrative. Wording is our own. Not legal advice.
#
# Every rule, parameter and enumeration item carries `source:` in one of these forms (D1.8):
#   "<instrument> Art. N"                    the article states it
#   "interpretation of <instrument> Art. N"  our reading of the article (a choice we made)
#   "<instrument> (article TBC)"             instrument confirmed, article number not yet cited
#   "SAMA Instructions for Motor Insurance Claims' Settlement, circular 14 May 2023"  (CSI, cited as a whole)
#   "CMIR Policy Schedule, per-claim coverage limit (insurer may agree higher)"  (towing)
#   "insurer-specific (illustrative)"        a value or term the fictional insurer chose
#   "reported, unverified"                   from secondary sources; not checked against an instrument
# Consumers: src/engine/datagen/render_policy.py (documents + sources table), rules_engine.py (gold labels).

version: v1

instruments:
  UP:
    name: "Unified Compulsory Motor Insurance Policy"
    issuer: "SAMA-issued, administered by the Insurance Authority"
    in_force: "2023-04-01"
    url: "https://rulebook.sama.gov.sa/en/node/7886"
    checked: "Art. 3, 4 (+ Appendix A), 5, 6, 9(7) verified by Hamzah against the primary text 2026-10-30 (our fetcher saw only the blank schedule)."
  CMIR:
    name: "Comprehensive Motor Insurance Rules (SAMA Decision 3/S/445, 21/04/1445H)"
    issuer: "SAMA-issued, administered by the Insurance Authority"
    url: "https://www.ia.gov.sa/Documents/Rules/en/Comprehensive_Motor_Insurance_Rules.pdf"
    checked: "Art. 1.8, 5.3, 5.4 (5.4.5 says the company MAY charge), 5.5, 5.6, 7.1-7.21 verified by Hamzah against the IA PDF 2026-10-30; also cross-checked by us against rulebook.sama.gov.sa/en/entiresection/8038 (machine summary)."
  CSI:
    name: "Instructions for Motor Insurance Claims' Settlement (SAMA circular, 14 May 2023)"
    issuer: "SAMA-issued, administered by the Insurance Authority"
    checked: "Verified by Hamzah 2026-10-30; cited as a whole (no article numbers)."

fiction:
  insurer_en: "Oasis Motor Insurance"
  insurer_ar: "واحة لتأمين المركبات"
  label_en: >-
    FICTIONAL INSURER. Rules follow the SAMA Unified Compulsory Motor Insurance Policy and Comprehensive Motor
    Insurance Rules (articles cited), administered by the Insurance Authority; insurer-specific terms and the
    insurer are illustrative. Not legal advice.
  label_ar: >-
    شركة تأمين وهمية. تتبع القواعد الوثيقة الموحدة للتأمين الإلزامي على المركبات وقواعد التأمين الشامل على
    المركبات الصادرة عن البنك المركزي السعودي (مع ذكر المواد)، والتي تشرف عليها هيئة التأمين؛ أما الشروط الخاصة
    بالشركة والشركة نفسها فهي توضيحية. ليست استشارة قانونية.

# --- Parameters used by the rules engine. ----------------------------------------------------------------------
params:
  currency: {value: SAR, source: "insurer-specific (illustrative)"}
  rounding: {value: half_up_whole_sar, source: "insurer-specific (illustrative)"}
  fault_shares:
    value: [0, 25, 50, 75, 100]
    source: "reported, unverified"
    note: "Najm assigns liability in 25% steps (secondary sources)."
  tp_payout_proportional_to_fault:
    value: true
    source: "interpretation of UP Art. 3"
    note: "Insurer pays third parties (Art. 3); payout = damage x policyholder's fault share is our reading."
  tpl_cap_sar:
    value: 10000000
    source: "UP Art. 4"
    note: "Per event (Art. 4 + Appendix A). Never binds on synthetic claims; kept for fidelity."
  tp_licence_grace_days:
    value: 50
    source: "UP Art. 5"
    note: "Calendar days after the accident; no recovery right if the expired licence was renewed in time."
  od_licence_grace_business_days:
    value: 50
    source: "CMIR Art. 7.2"
    note: "Business days after the accident; wrong class or forfeited licence gets no grace."
  business_days:
    value: [sun, mon, tue, wed, thu]
    source: "interpretation of CMIR Art. 7.2"
    note: "Saudi working week; public holidays ignored (simplification)."
  fixed_deductible_sar:
    value: 1000
    source: "insurer-specific (illustrative)"
    note: "Amount set in the schedule (CMIR Art. 5.4.1), fixed for the policy period (CMIR Art. 5.4.7)."
  etl_pct:
    value: 60
    source: "insurer-specific (illustrative)"
    note: "Economic total loss when repair > etl_pct% of sum insured; % set in the schedule."
  reporting_window_days:
    value: 15
    source: "insurer-specific (illustrative)"

# --- FAQ-only facts: published in the policy, never used in adjudication. --------------------------------------
faq_only:
  tp_licence_grace_days_faq: {value: 50, source: "UP Art. 5", note: "calendar days (TPL)"}
  od_licence_grace_business_days_faq: {value: 50, source: "CMIR Art. 7.2", note: "business days (COMP)"}
  deductible_when_not_liable_sar: {value: 0, source: "CMIR Art. 5.4.4"}
  deduction_for_prior_use: {value: "no", source: "CMIR Art. 5.3.4"}
  towing_city_sar: {value: 500, source: "CMIR Policy Schedule, per-claim coverage limit (insurer may agree higher)", note: "inside a city; towing itself is CMIR Art. 5.5"}
  towing_outside_city_sar: {value: 1000, source: "CMIR Policy Schedule, per-claim coverage limit (insurer may agree higher)", note: "outside a city"}
  small_claim_threshold_sar: {value: 2000, source: "SAMA Instructions for Motor Insurance Claims' Settlement, circular 14 May 2023"}
  small_claim_settle_working_days: {value: 5, source: "SAMA Instructions for Motor Insurance Claims' Settlement, circular 14 May 2023"}
  other_claim_settle_days: {value: 15, source: "SAMA Instructions for Motor Insurance Claims' Settlement, circular 14 May 2023", note: "calendar days"}
  missing_docs_notice_working_days: {value: 3, source: "SAMA Instructions for Motor Insurance Claims' Settlement, circular 14 May 2023", note: "individual customers"}
  total_loss_report_working_days: {value: 7, source: "SAMA Instructions for Motor Insurance Claims' Settlement, circular 14 May 2023", note: "from complete documents"}
  replacement_car_in_base_policy: {value: "no", source: "insurer-specific (illustrative)", note: "optional add-on needing prior approval (CMIR Art. 5.6)"}
  claim_statuses: {value: [Incomplete, Outstanding, Settled, Rejected], source: "SAMA Instructions for Motor Insurance Claims' Settlement, circular 14 May 2023"}
  at_fault_other_party_options:
    value: "claim from the other party's insurer, or own COMP insurer pays with no deductible and subrogates"
    source: "interpretation of CMIR Art. 5.4.4"

# --- Enumerations (EN + AR labels; each item sourced). -----------------------------------------------------------
