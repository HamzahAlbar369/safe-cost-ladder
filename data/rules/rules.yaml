  domestic_worker: {en: "the insured's domestic worker", ar: "العامل المنزلي لدى المؤمَّن له", source: "CMIR Art. 1.8"}
  sponsored_driver: {en: "a driver sponsored by the insured", ar: "سائق على كفالة المؤمَّن له", source: "CMIR Art. 1.8"}

exclusions:
  third_party_deny:      # deny a third-party claim
    fled_scene: {en: "the driver fled the accident scene", ar: "هروب السائق من موقع الحادث", source: "UP Art. 6"}
    intoxication: {en: "driving under the influence of alcohol or drugs", ar: "القيادة تحت تأثير الكحول أو المخدرات", source: "UP Art. 6"}
    racing_or_drifting: {en: "drifting (tafheet) or racing", ar: "التفحيط أو السباق", source: "UP Art. 6"}
    deliberate: {en: "the accident was caused deliberately", ar: "تعمّد التسبب في الحادث", source: "UP Art. 6"}
    misrepresentation: {en: "material misrepresentation in the claim", ar: "تقديم معلومات جوهرية غير صحيحة في المطالبة", source: "UP Art. 6"}
