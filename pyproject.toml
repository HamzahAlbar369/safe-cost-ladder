[project]
name = "engine"
version = "0.1.0"
description = "Efficiency layer: cheapest (model, effort) config that meets each task's accuracy floor and latency budget."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "httpx>=0.27",
    "numpy>=2.4.6",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
    "typer>=0.12",
]

[project.scripts]
engine = "engine.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: over ~10 s (committed-matrix replay, data regeneration, gold scans of every split); skipped by `engine check --fast` (D3.1)"]

[tool.ruff.lint.per-file-ignores]
"src/engine/smoke_fixtures.py" = ["E501"]  # bilingual probe text, kept verbatim
"src/engine/datagen/templates/bank_*.py" = ["E501"]  # bilingual phrase banks, kept verbatim
"src/engine/eval/analysis_text.py" = ["E501"]  # report layout strings
"src/engine/eval/phase3_report.py" = ["E501"]  # report layout strings
"src/engine/router/*.py" = ["E501"]  # docstrings and Jev question text
